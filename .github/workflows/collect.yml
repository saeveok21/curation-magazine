name: 콘텐츠 수집

on:
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다 (UTC 기준)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/collect.py
      - name: 변경사항 저장
        run: |
          git config user.name "curation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "수집: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
